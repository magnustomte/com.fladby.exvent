<script type="text/javascript">

Homey.setTitle( __('pair.freeway.title') );

$(function() {
  $('#name').val( __('pair.default_name') );

  $('#connect').click(function() {
    $('.freewayWeb-error').hide();

    var inputname = $('#name').val().trim();
    var inputaddress = $('#address').val().trim();
    var inputport = Number($('#port').val());

    if (inputname === '' || inputaddress === '' || !inputport) {
      $('.freewayWeb-error-msg').html( __('pair.nosettings') );
      $('.freewayWeb-error').show();
      return;
    }

    // Only needs to be unique; the name is what the user sees
    var deviceId = Math.random().toString(36).substr(2, 5).toLowerCase();

    Homey.addDevice({
      name     : inputname,
      data     : { id: deviceId },
      settings : { address: inputaddress, port: inputport },
    }, function(error, result) {
      if (error) {
        $('.freewayWeb-error-msg').html(error.message || error.toString());
        $('.freewayWeb-error').show();
        return;
      }
      Homey.done();
    });
  });
})
</script>

    margin-bottom: 12px;
  }
  .form-group label {

	}

  }

    min-width: 150px;
    font-weight: 700;
  }

  }
  .button:disabled {

</style>

<p data-i18n="pair.freeway.intro"></p>
